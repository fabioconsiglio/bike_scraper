name: Daily Bike Scraper

on:
  workflow_dispatch:   # ← trigger manually from the Actions tab
  repository_dispatch: 
    types: [run-scraper]


env: 
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true 

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bike scraper
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python bike_scraper.py

      - name: Commit seen_listings.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_listings.json
          git diff --cached --quiet || git commit -m "chore: update seen_listings [skip ci]"
          git push
