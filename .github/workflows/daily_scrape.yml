name: Bike Scraper with ML Matching


on:
  workflow_dispatch:   # ← trigger manually from the Actions tab
  repository_dispatch: 
    types: [run-scraper]

jobs:
  scrape-and-match:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache ML Model Weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/hub
            ~/.config/Ultralytics
          key: ${{ runner.os }}-ml-weights-${{ hashFiles('bike_scraper.py') }}
          restore-keys: |
            ${{ runner.os }}-ml-weights-

      - name: Install Dependencies
        run: |
          # Install CPU-only PyTorch to save space and time on GitHub Actions
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python bike_scraper.py