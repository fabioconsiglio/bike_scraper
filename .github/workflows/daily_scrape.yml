name: Bike Scraper with ML Matching


on:
  workflow_dispatch:   # ← trigger manually from the Actions tab
  repository_dispatch: 
    types: [run-scraper]

jobs:
  scrape-and-match:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install uv (with its own lightning-fast caching enabled)
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 2. Setup Python (Notice we removed 'cache: pip' here)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache ML Model Weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/torch/hub
            ~/.config/Ultralytics
          key: ${{ runner.os }}-ml-weights-${{ hashFiles('bike_scraper.py') }}
          restore-keys: |
            ${{ runner.os }}-ml-weights-

      # 3. Use 'uv pip install --system' instead of 'pip install'
      - name: Install Dependencies
        run: |
          uv pip install --system torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -r requirements.txt

      - name: Run Scraper
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SENDER: ${{ secrets.SENDER }}
          RECIPIENT: ${{ secrets.RECIPIENT }}
          
        run: python bike_scraper.py